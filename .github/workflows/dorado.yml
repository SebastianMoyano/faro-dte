name: corpus dorado

# L15: la salida del motor es reproducible byte a byte, en Python y en el núcleo Go.
# Si este workflow falla, alguien movió un byte de la firma: se averigua, no se regenera.
# Los mismos gates, en local y de una vez: ./tools/prueba_final.sh (con red) — aquí sin red.
on:
  push:
    paths: ["core/**", "api/**", "nucleo/**", "nucleo-rs/**", "tests/dorado/**", "tools/**", "docs/**", "*.py", "*.md", "requirements.txt", ".github/workflows/dorado.yml"]
  pull_request:

jobs:
  dorado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # la auditoría pública recorre toda la historia
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Público (ni RUTs reales, ni personas, ni secretos; árbol, historia y .gitignore)
        run: python tools/auditar_publico.py
      - name: Los gates del gate (que los auditores detecten lo que deben)
        run: python tools/auditar_publico.py --autoprueba && python tools/auditar_release.py --autoprueba
      - name: Python puro == esperado (15 casos)
        run: python test_dorado.py
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.10", cache-dependency-path: nucleo/go.sum }
      - name: Núcleo Go — vet + tests (xsd, pdf417, portal, rcv, rvd, sii, siiengine, servidor)
        working-directory: nucleo
        run: go vet ./... && go test ./... && go build -o bin/nucleo-dorado ./cmd/nucleo-dorado && go build -o bin/nucleo-servidor ./cmd/nucleo-servidor
      - name: Go == esperado (port externo)
        run: python test_dorado.py --port nucleo/bin/nucleo-dorado
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: nucleo-rs }
      - name: Núcleo Rust (fase 8) — tests + clippy + build
        working-directory: nucleo-rs
        run: cargo test --quiet && cargo clippy --release --quiet -- -D warnings && cargo build --release --quiet
      - name: Rust == esperado (port externo)
        run: python test_dorado.py --port nucleo-rs/target/release/nucleo-dorado
      - name: Esquema dorado (la base de Rust == la de Python)
        run: python tools/esquema_dorado.py --go nucleo-rs/target/release/nucleo-servidor
      - name: Mundo de práctica (sin red)
        run: python test_simulacion.py
      - name: Esquema dorado (la base de Go == la de Python)
        run: python tools/esquema_dorado.py --go nucleo/bin/nucleo-servidor
      - name: Contrato dorado (los dos motores, sin red)
        env:
          APP_SHELL_KEY: ci-${{ github.run_id }}-${{ github.sha }}   # el motor exige una clave de 24+ caracteres
          RVD_SCHEDULER_ACTIVO: "false"
        run: |
          python setup.py >/dev/null 2>&1 || true
          python -m uvicorn main:app --port 8771 >py.log 2>&1 &
          nucleo/bin/nucleo-servidor servir --puerto 8010 --motor http://127.0.0.1:8771 >go.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8771/ >/dev/null && curl -sf http://127.0.0.1:8010/ >/dev/null && break; sleep 1; done
          python tools/contrato_api.py --python http://127.0.0.1:8771 --go http://127.0.0.1:8010 --escenario todos --sin-red
      - name: Contrato dorado (Python vs Rust, sin red) + MCP Rust por stdio
        env:
          APP_SHELL_KEY: ci-${{ github.run_id }}-${{ github.sha }}
          RVD_SCHEDULER_ACTIVO: "false"
        run: |
          nucleo-rs/target/release/nucleo-servidor servir --puerto 8012 --motor http://127.0.0.1:8771 >rs.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8012/ >/dev/null && break; sleep 1; done
          python tools/contrato_api.py --python http://127.0.0.1:8771 --go http://127.0.0.1:8012 --escenario todos --sin-red
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | nucleo-rs/target/release/nucleo-mcp --env /dev/null --db /tmp/mcp-rs.db | grep -q '"name":"emitir_dte"'
